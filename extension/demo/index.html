<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaqeen · يقين</title>
<meta name="description" content="Yaqeen checks Quran verses and hadith in social media posts against approved sources only.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="ui.css">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  body { margin:0; background:var(--bg) }
  .wrap { max-width:1152px; margin:0 auto; padding-inline:16px }
  .topbar { background:var(--surface); border-bottom:1px solid var(--border) }
  .topbar .wrap { display:flex; justify-content:space-between; align-items:center; padding-block:14px }
  .logo { display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:24px; color:var(--brand) }
  .hero { background:var(--brand); color:var(--on-brand) }
  .hero .wrap { display:flex; justify-content:space-between; align-items:center; gap:40px; padding-block:48px }
  .hero__text { display:flex; flex-direction:column; gap:12px; max-width:620px }
  .eyebrow { font-size:14px; font-weight:700; color:#E3C77F; margin:0 }
  .hero h1 { margin:0; font-size:clamp(28px, 5vw, 44px); font-weight:800; line-height:1.3 }
  .tagline { margin:0; font-size:17px; line-height:1.8; color:#D6E8E0 }
  .hero .yq-mark { width:180px; height:180px }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:24px; align-items:start }
  .col { display:flex; flex-direction:column; gap:14px; min-width:0 }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:12px }
  h2 { font-size:20px; font-weight:800; margin:0 }
  .form { display:flex; flex-direction:column; gap:10px }
  .form label { font-size:13px; color:var(--muted) }
  textarea { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px; font:inherit; font-size:15px; resize:vertical; min-height:110px }
  textarea:focus { outline:2px solid var(--brand); outline-offset:1px }
  .form .btn { height:48px; font-size:16px; font-weight:800 }
  #out { display:flex; flex-direction:column; gap:12px }
  .muted { color:var(--muted); font-size:13px; margin:0 }
  .post { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px }
  .post__user { display:flex; align-items:center; gap:8px }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--subtle); color:var(--muted); display:grid; place-items:center; font-weight:700 }
  .post__text { margin:0; font-size:15px; line-height:1.8 }
  .post__yq { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .post__check { background:var(--bg); border-color:var(--border); color:var(--text) }
  .post__badges { display:flex; gap:6px; flex-wrap:wrap; font-size:13px; color:var(--muted) }
  .post__cards { display:flex; flex-direction:column; gap:12px }
  .post__cards:empty { display:none }
  button:disabled { opacity:.5 }
  .yq .card { max-width:none }
  .footer { border-top:1px solid var(--border); padding-block:20px; display:flex; flex-direction:column; gap:6px; text-align:center }
  .tabs { background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5 }
  .tabs .wrap { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none }
  .tab { padding:14px 14px 12px; color:var(--muted); font-weight:700; font-size:14px; text-decoration:none; white-space:nowrap; border-bottom:3px solid transparent }
  .tab:hover { color:var(--brand) }
  .tab[aria-current="page"] { color:var(--brand); border-bottom-color:var(--brand) }
  .view { display:flex; flex-direction:column; gap:16px; padding-block:28px }
  .view > .grid { padding-block:0 }
  #status { margin-top:16px }
  .post--x { max-width:600px; width:100%; margin-inline:auto; border-color:#E1E8ED }
  .who { display:flex; flex-direction:column; line-height:1.3 }
  .post__actions { display:flex; justify-content:space-between; border-top:1px solid #EFF3F4; padding:8px 8px 0; color:#AAB8C2; pointer-events:none; user-select:none }
  .topbar__actions { display:flex; gap:8px; align-items:center }
  .topbar__actions .btn { display:inline-flex; align-items:center; gap:6px; text-decoration:none }
  .topbar__actions a[aria-current] { border-color:var(--brand); color:var(--brand) }
  .center { text-align:center }
  .phone { width:100%; max-width:380px; margin:8px auto 0; border:10px solid #1B1F23; border-radius:44px; background:#fff; overflow:hidden; box-shadow:0 12px 40px rgba(15,91,74,.18) }
  .phone__status { display:flex; justify-content:space-between; align-items:center; padding:8px 20px 4px; font-size:12px; font-weight:700; direction:ltr; color:#0F1419 }
  .phone__notch { width:90px; height:22px; background:#1B1F23; border-radius:0 0 14px 14px; margin-top:-8px }
  .phone__bar { display:grid; grid-template-columns:24px 1fr 24px; align-items:center; text-align:center; padding:8px 14px; border-bottom:1px solid #EFF3F4; font-size:15px }
  .phone .post--x { border:0; border-radius:0; max-width:none; min-height:420px }
  .phone .post--x .card { max-width:none }
  .phone__home { width:120px; height:5px; border-radius:3px; background:#1B1F23; margin:10px auto 8px }
  .legend { border-top:1px solid var(--border); padding-top:16px; margin-top:4px }
  .legend h3 { margin:0 0 10px; font-size:15px }
  .legend ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px }
  .legend li { display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:1.7 }
  .legend .badge { align-self:flex-start }
  .post--x .card { max-width:440px }
  .browser { display:flex; flex-direction:column; max-width:760px; width:100%; margin-inline:auto; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:#EEF1F3 }
  .browser__bar { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border) }
  .browser__dots { display:flex; gap:6px } .browser__dots i { width:10px; height:10px; border-radius:50%; background:var(--border) }
  .browser__url { flex:1; background:var(--bg); border-radius:999px; padding:4px 14px; font-size:13px; color:var(--muted); direction:ltr; text-align:left }
  .browser__icon { display:grid; place-items:center; width:32px; height:32px; border-radius:8px; background:var(--tint) }
  .popup { width:min(400px, 100%); align-self:flex-end; background:var(--bg); padding:18px; display:flex; flex-direction:column; gap:14px; box-shadow:0 8px 24px rgba(26,30,26,.15) }
  .popup__head { display:flex; justify-content:space-between; align-items:center }
  .logo--sm { font-size:22px }
  .popup__link { color:var(--brand); font-size:13px; font-weight:600; text-decoration:none }
  .popup .form .btn { height:44px; font-size:15px }
  .popup textarea { background:var(--surface); min-height:76px }
  #pout { display:flex; flex-direction:column; gap:12px }
  .foot { text-align:center; font-size:12px }
  .settings { max-width:720px; width:100%; margin-inline:auto; display:flex; flex-direction:column; gap:16px }
  .settings__head { display:flex; align-items:center; gap:12px } .settings__head h2 { font-size:26px; color:var(--brand) }
  h3 { margin:0; font-size:17px }
  .stats { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px }
  .stat { border-radius:12px; padding:12px 16px; display:flex; flex-direction:column }
  .stat span { font-size:13px } .stat b { font-size:24px }
  .stat--quran { background:var(--quran-bg); color:var(--quran-fg) } .stat--hadith { background:var(--hadith-bg); color:var(--hadith-fg) }
  .toggle { display:flex; justify-content:space-between; align-items:center; gap:16px; font-size:15px }
  .toggle input { width:22px; height:22px; accent-color:var(--brand); flex:none }
  .toggle select { font:inherit; height:40px; border:1px solid var(--border); border-radius:10px; padding:0 10px; background:var(--surface) }
  .types { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px }
  .type .badge { align-self:flex-start }
  .type p { margin:0; font-size:14px; line-height:1.8 }
  .drop { border:2px dashed var(--border); border-radius:16px; padding:28px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; text-align:center; background:var(--bg) }
  .drop--over, .drop:hover { border-color:var(--brand); background:var(--tint) }
  .preview img { max-width:100%; max-height:360px; border-radius:12px; display:block; margin:14px auto 0 }
  #mout { display:flex; flex-direction:column; gap:12px }
  .btn--install { align-self:flex-start; margin-top:8px; background:#E3C77F; color:var(--brand-dark); font-weight:800; font-size:16px; padding:12px 22px; text-decoration:none }
  .btn--big { align-self:flex-start; font-size:17px; font-weight:800; padding:14px 26px; text-decoration:none }
  .install { max-width:880px; width:100%; margin-inline:auto; box-sizing:border-box }
  .steps { list-style:none; margin:0 auto; padding:0; max-width:880px; width:100%; display:flex; flex-direction:column; gap:14px }
  .step { display:grid; grid-template-columns:auto minmax(0, 1fr) 290px; gap:16px; align-items:center }
  .step__n { width:36px; height:36px; border-radius:50%; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-weight:800; align-self:start }
  .step__text h3 { margin:0 0 4px } .step__text p { margin:0; font-size:14px; line-height:1.8 }
  .copyline { display:flex; gap:8px; align-items:center; margin-top:8px !important; flex-wrap:wrap }
  .copyline code { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:14px }
  .mock { border:1px solid var(--border); border-radius:12px; background:var(--bg); overflow:hidden; font-size:12px; direction:ltr }
  .mock--file { display:flex; align-items:center; gap:8px; padding:16px; color:var(--brand); font-weight:700 }
  .folder { width:26px; height:20px; background:#E3C77F; border-radius:3px; position:relative } .folder::before { content:""; position:absolute; top:-4px; left:0; width:11px; height:5px; background:#E3C77F; border-radius:2px 2px 0 0 }
  .mock__bar { background:var(--surface); border-bottom:1px solid var(--border); padding:8px }
  .mock__url { display:block; background:var(--bg); border-radius:999px; padding:4px 10px; color:var(--muted) }
  .mock__body { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:14px 10px }
  .mock__body--col { flex-direction:column }
  .mock__dev, .mock__btn { white-space:nowrap }
  .mock__dev { display:inline-flex; align-items:center; gap:6px; color:var(--text); padding:4px 6px; border-radius:8px }
  .mock__btn { border:1px solid var(--border); border-radius:8px; padding:5px 10px; background:var(--surface); color:var(--brand); font-weight:700 }
  .sw { width:26px; height:14px; border-radius:999px; background:var(--brand); position:relative; display:inline-block } .sw::after { content:""; position:absolute; top:2px; right:2px; width:10px; height:10px; border-radius:50%; background:#fff }
  .mock .hi { outline:2px solid #D9822B; outline-offset:2px; color:var(--text) }
  @media (max-width:820px) {
    .step { grid-template-columns:auto minmax(0, 1fr) }
    .step .mock { grid-column:2 }
  }
  @media (max-width:820px) {
    .grid { grid-template-columns:minmax(0, 1fr) }
    .hero .yq-mark { display:none }
    .hero .wrap { padding-block:32px }
  }
</style>
</head>
<body>
<div class="yq" id="app"></div>
<script src="demo.js" type="module"></script>
</body>
</html>
