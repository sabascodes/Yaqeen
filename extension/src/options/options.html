<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaqeen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
  body { background:var(--bg); margin:0 }
  main { max-width:720px; margin:32px auto; padding:0 16px; display:flex; flex-direction:column; gap:16px }
  section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:12px }
  h1 { color:var(--brand); font-size:26px } h2 { font-size:17px }
  label { display:flex; gap:10px; align-items:flex-start }
  select { font:inherit; padding:6px 10px; border-radius:10px; border:1px solid var(--border) }
  .muted { color:var(--muted); font-size:13px }
  progress { width:100% }
  button:disabled { opacity:.5; cursor:default }
  ul { padding-inline-start:20px }
</style>
</head>
<body>
<main class="yq" id="app"></main>
<script src="options.js" type="module"></script>
</body>
</html>
