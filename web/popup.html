<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaqeen popup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- أزرار المعاينة فقط: احذفها في النسخة النهائية للإضافة -->
<div class="demo-tabs" id="tabs" role="group" aria-label="Preview states"></div>

<main class="popup">
  <div class="popup__head">
    <a class="logo" href="#" aria-label="Yaqeen">
      <span class="logo__mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.8 12.2l2.2 2.2 4.4-4.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span id="logoText"></span>
    </a>
    <button class="lang-toggle" id="langBtn" type="button"></button>
  </div>
  <form class="row" id="checkForm"><input class="input" id="q" autocomplete="off"><button class="btn btn--primary" type="submit" id="checkBtn"></button></form>
  <p class="popup__summary" id="summary"></p>
  <div id="view" aria-live="polite"></div>
  <p class="popup__foot" id="foot"></p>
</main>

<script src="cards.js"></script>
<script>
const P = {
  ar: { logo:'يقين', toggle:'English', foot:'نعتمد على المصادر المعتمدة فقط · لا نصدر فتاوى',
    sum:{result:'تم رصد نصّين دينيين في هذه الصفحة',loading:'جارٍ التحقق من المحتوى…',error:'',needs:'',custom:''},
    steps:[['اكتشاف النص الديني','done'],['استخراج النص من الصورة (OCR)','done'],['المطابقة مع المصادر المعتمدة','active'],['إعداد النتيجة','pending']],
    errBadge:'تعذّر إكمال التحقق', errT:'تعذّر الاتصال بقاعدة المصادر', errP:'تحقق من اتصالك بالإنترنت ثم أعد المحاولة. لن نعرض أي نتيجة دون مصدر معتمد.', retry:'إعادة المحاولة',
    needBadge:'نحتاج توضيحًا', needT:'النص قصير جدًا للمطابقة بثقة', needP:'حدّد النص كاملًا من المنشور أو الصقه هنا، وسنطابقه مع المصادر المعتمدة.', ph:'الصق النص هنا…', verify:'تحقق الآن', select:'تحديد من الصفحة',
    ph2:'اكتب نصًا للتحقق منه…', check:'تحقق', tabs:{result:'النتيجة',loading:'التحميل',error:'الخطأ',needs:'يحتاج توضيحًا'} },
  en: { logo:'Yaqeen', toggle:'العربية', foot:'Approved sources only · No rulings issued',
    sum:{result:'2 religious texts detected on this page',loading:'Verifying content…',error:'',needs:'',custom:''},
    steps:[['Detecting religious text','done'],['Extracting text from image (OCR)','done'],['Matching approved sources','active'],['Preparing result','pending']],
    errBadge:'Verification failed', errT:'Couldn’t reach the sources database', errP:'Check your connection and try again. We never show a result without an approved source.', retry:'Try again',
    needBadge:'Needs your input', needT:'The text is too short to match confidently', needP:'Select the full text from the post or paste it here and we’ll match it against approved sources.', ph:'Paste the text here…', verify:'Verify now', select:'Select on page',
    ph2:'Type a text to verify…', check:'Verify', tabs:{result:'Result',loading:'Loading',error:'Error',needs:'Needs input'} }
};
const API_URL = 'http://127.0.0.1:8000/verify';   // عنوان الخدمة (الباك-إند)
let customHTML = '';
let lang = localStorage.getItem('yaqeen-lang') || 'ar', state = 'result';
const e = YQ.esc;

function views(){
  const p = P[lang];
  return {
    custom: () => customHTML,
    result: () => YQ.card(YQ.sample(lang === 'ar' ? 'weak' : 'wording', lang), lang),
    loading: () => `<div class="panel"><ul class="steps">${p.steps.map(s => `<li class="${s[1]}"><i></i>${e(s[0])}</li>`).join('')}</ul><div class="skel"></div><div class="skel skel--s"></div></div>`,
    error: () => `<div class="panel" data-type="weak"><span class="badge"><i class="dot"></i>${e(p.errBadge)}</span><h3>${e(p.errT)}</h3><p>${e(p.errP)}</p><button class="btn btn--primary" type="button">${e(p.retry)}</button></div>`,
    needs: () => `<div class="panel" data-type="wording"><span class="badge"><i class="dot"></i>${e(p.needBadge)}</span><h3>${e(p.needT)}</h3><p>${e(p.needP)}</p><input class="input" placeholder="${e(p.ph)}" aria-label="${e(p.ph)}"><div class="row"><button class="btn btn--primary" type="button">${e(p.verify)}</button><button class="btn btn--secondary" type="button">${e(p.select)}</button></div></div>`
  };
}

function render(){
  const p = P[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('logoText').textContent = p.logo;
  document.getElementById('langBtn').textContent = p.toggle;
  document.getElementById('foot').textContent = p.foot;
  document.getElementById('q').placeholder = p.ph2;
  document.getElementById('checkBtn').textContent = p.check;
  document.getElementById('summary').textContent = p.sum[state];
  document.getElementById('view').innerHTML = views()[state]();
  document.getElementById('tabs').innerHTML = Object.keys(p.tabs).map(k =>
    `<button type="button" data-s="${k}" aria-pressed="${k === state}">${e(p.tabs[k])}</button>`).join('');
}
document.getElementById('tabs').addEventListener('click', ev => { const b = ev.target.closest('[data-s]'); if (b){ state = b.dataset.s; render(); } });
document.getElementById('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('yaqeen-lang', lang); render(); });
render();

/* ---- الربط بالباك-إند ---- */
async function verify(text){
  state = 'loading'; render();
  try {
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    const data = await r.json();
    if (data.status === 'ok') { customHTML = YQ.card(data.card, lang); state = 'custom'; }
    else if (data.status === 'needs_input') { state = 'needs'; }
    else { state = 'error'; }
  } catch (err) { state = 'error'; }
  render();
}
document.getElementById('checkForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const t = document.getElementById('q').value.trim();
  if (t) verify(t);
});
</script>
</body>
</html>
