# Live web demo of Yaqeen (extension/demo). The browser extension itself is built with `npm run build`.
[build]
  base = "extension"
  command = "npm install --ignore-scripts && npm run build:demo"
  publish = "demo-dist"

[functions]
  directory = "netlify/functions"

# Lets the speech-to-text model use several CPU threads (needs cross-origin isolation).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
